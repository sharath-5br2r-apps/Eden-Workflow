name: "Release"

on:
  workflow_call:
    inputs:
      build-id:
        description: 'Identifier for workflows and caching'
        type: string
        required: true
      devel:
        description: 'Development mode (disables update checker)'
        type: string
        required: true
      status:
        description: 'The result of the prior build step.'
        type: string
        required: true

jobs:
  release:
    name: "Release"

    env:
      GH_TOKEN: "${{ secrets.CUSTOM_GITHUB_TOKEN }}"
      FJ_TOKEN: "${{ secrets.FORGEJO_TOKEN }}"

      B2_TOKEN: "${{ secrets.B2_TOKEN }}"
      B2_KEY: "${{ secrets.B2_KEY }}"

      CF_ZONE_ID: "${{ secrets.CF_ZONE_ID }}"
      CF_TOKEN: "${{ secrets.CF_TOKEN }}"

      VPS_SSH_HOST: "${{ secrets.VPS_SSH_HOST }}"
      VPS_SSH_PORT: "${{ secrets.VPS_SSH_PORT }}"
      VPS_SSH_PRIV: "${{ secrets.VPS_SSH_PRIV }}"
      VPS_SSH_PUB: "${{ secrets.VPS_SSH_PUB }}"
      DISCORD_WEBHOOK: "${{ secrets.DISCORD_WEBHOOK }}"
      DEVEL: "${{ inputs.devel }}"
      STATUS: "${{ inputs.status }}"
      BUILD_ID: "${{ inputs.build-id }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          skip-decompress: true
          merge-multiple: true

      - name: Load environments
        run: |
          export FORGEJO_LENV=forgejo.env
          [ -f "$FORGEJO_LENV" ] || exit 0

          . ./.ci/fj/load-env.sh
          . ./.ci/release/steps.sh | tee -a "$GITHUB_ENV"

      # - name: Delete Previous PR Number
      #   if: ${{ env.RELEASE_PR == '1' }}
      #   run: gh release delete "$FORGEJO_PR_NUMBER" --repo "$RELEASE_REPO" --cleanup-tag -y
      #   continue-on-error: true

      # - name: Release
      #   id: release
      #   if: ${{ env.RELEASE_GH == '1' }}
      #   uses: softprops/action-gh-release@v2.5.0
      #   with:
      #     name: "${{ env.GITHUB_TITLE }}"
      #     tag_name: ${{ env.GITHUB_TAG }}
      #     repository: ${{ env.RELEASE_REPO }}
      #     body_path: ./changelog.md
      #     token: ${{ env.GH_TOKEN }}
      #     prerelease: false
      #     draft: ${{ inputs.build-id == 'tag' }}
      #     generate_release_notes: false
      #     make_latest: true
      #     files: |
      #       artifacts/*

      - name: Release Script
        id: release
        if: ${{ always() }}
        run: ./.ci/release.sh

      - name: Generate build.json
        if: ${{ always() && inputs.status == 'success' }}
        run: |
          python3 -c '
          import os, json, glob, subprocess, zipfile, re

          build_json = {}
          artifacts = glob.glob("artifacts/*")
          changelog = open("changelog.md").read() if os.path.exists("changelog.md") else ""
          for art in artifacts:
              if not os.path.isfile(art):
                  continue
              filename = os.path.basename(art)
              ext = filename.split(".")[-1] if "." in filename else "bin"
              is_apk = ext.lower() in ["apk", "apks", "xapk", "apkm"] or "android" in filename.lower()
              arch = "all" if is_apk else "universal"
              if "aarch64" in filename.lower() or "arm64" in filename.lower():
                  arch = "arm64-v8a" if is_apk else "aarch64"
              elif "x86_64" in filename.lower() or "amd64" in filename.lower():
                  arch = "x86_64" if is_apk else "amd64"

              min_sdk = "24"
              native_libraries = []
              densities = []

              if ext.lower() in ["apk", "apks", "xapk", "apkm"]:
                  try:
                      aapt = subprocess.run(["which", "aapt2"], capture_output=True, text=True).stdout.strip() or subprocess.run(["which", "aapt"], capture_output=True, text=True).stdout.strip()
                      if aapt:
                          out = subprocess.run([aapt, "dump", "badging", art], capture_output=True, text=True).stdout
                          m_sdk = re.search(r"(?:sdkVersion|minSdkVersion):\x27([^\x27]+)\x27", out)
                          if m_sdk:
                              min_sdk = m_sdk.group(1)
                          m_den = re.search(r"densities:\s*\x27([^\x27]+)\x27", out)
                          if m_den:
                              densities = [d for d in m_den.group(1).split() if d]
                          m_nat = re.search(r"native-code:\s*\x27([^\x27]+)\x27", out)
                          if m_nat:
                              native_libraries = [n for n in m_nat.group(1).split() if n]
                  except Exception as e:
                      print(f"aapt dump failed: {e}")

                  if not native_libraries and zipfile.is_zipfile(art):
                      try:
                          with zipfile.ZipFile(art, "r") as z:
                              libs = set()
                              for f in z.namelist():
                                  if f.startswith("lib/") and "/" in f[4:]:
                                      libs.add(f.split("/")[1])
                              if libs:
                                  native_libraries = sorted(list(libs))
                      except Exception as e:
                          print(f"zip inspection failed: {e}")

                  if not native_libraries:
                      if "x86_64" in filename.lower() or "chromeos" in filename.lower():
                          native_libraries = ["x86_64"]
                      elif "arm64" in filename.lower() or "aarch64" in filename.lower() or "v8a" in filename.lower():
                          native_libraries = ["arm64-v8a"]
                      else:
                          native_libraries = ["arm64-v8a", "x86_64"]

              entry_key = filename.lower()
              meta_item = {
                  "name": filename,
                  "arch": arch,
                  "ext": ext,
                  "version": os.environ.get("GITHUB_TAG", "latest"),
                  "patches": "eden-emulator",
                  "changelog": changelog,
                  "applied_patches": []
              }
              if ext.lower() in ["apk", "apks", "xapk", "apkm"]:
                  meta_item["min_sdk"] = min_sdk
                  meta_item["densities"] = densities
                  meta_item["native_libraries"] = native_libraries

              build_json[entry_key] = meta_item

          with open("build.json", "w") as f:
              json.dump(build_json, f, indent=2)
          '
          cp build.json artifacts/build.json || true

      - name: Release to GitHub Repository
        id: release_gh
        if: ${{ always() && inputs.status == 'success' }}
        uses: softprops/action-gh-release@v2.5.0
        with:
          name: "${{ env.GITHUB_TITLE }}"
          tag_name: ${{ env.GITHUB_TAG }}
          body_path: ./changelog.md
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
          draft: ${{ inputs.build-id == 'tag' }}
          generate_release_notes: false
          make_latest: true
          files: |
            artifacts/*

      - name: Upload changelog
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: changelog.md
          archive: false

  trigger_cleanup:
    needs: [release]
    if: ${{ needs.release.result == 'success' }}
    uses: ./.github/workflows/cleanup.yml
    secrets: inherit
